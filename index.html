<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FibFanatics — The Golden Brotherhood</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    @font-face {
      font-family: 'Cinzel';
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: url('/fonts/cinzel.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Raleway';
      font-style: normal;
      font-weight: 300 600;
      font-display: swap;
      src: url('/fonts/raleway.woff2') format('woff2');
    }

    :root {
      --gold: #f5c518;
      --gold-dark: #b8960c;
      --gold-light: #ffd96a;
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1c1c28;
      --text: #e8e0d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Raleway', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .particles {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: var(--gold);
      border-radius: 50%;
      animation: float linear infinite;
      opacity: 0;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
    }

    /* ─── LOGIN ─── */
    #login-page {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .login-logo {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-align: center; letter-spacing: 0.08em; margin-bottom: 0.25rem;
      filter: drop-shadow(0 0 20px rgba(245,197,24,0.4));
    }
    .login-tagline {
      color: var(--gold); font-size: 0.85rem; letter-spacing: 0.3em;
      text-transform: uppercase; opacity: 0.7; margin-bottom: 1.5rem; text-align: center;
    }
    .phi-badge {
      font-size: 4rem; line-height: 1; margin-bottom: 0.75rem;
      filter: drop-shadow(0 0 30px rgba(245,197,24,0.6));
      animation: pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(245,197,24,0.4)); }
      50%       { filter: drop-shadow(0 0 50px rgba(245,197,24,0.9)); }
    }
    .login-card {
      background: var(--surface);
      border: 1px solid rgba(245,197,24,0.2);
      border-radius: 1.5rem; padding: 2.5rem;
      width: 100%; max-width: 400px;
      box-shadow: 0 0 60px rgba(245,197,24,0.08), 0 20px 60px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }
    .login-card h2 {
      font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold);
      text-align: center; margin-bottom: 1.25rem; letter-spacing: 0.1em; opacity: 0.9;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label {
      display: block; font-size: 0.75rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--gold); opacity: 0.8; margin-bottom: 0.5rem;
    }
    .form-group input {
      width: 100%; background: var(--surface2);
      border: 1px solid rgba(245,197,24,0.25); border-radius: 0.6rem;
      padding: 0.8rem 1rem; color: var(--text);
      font-family: 'Raleway', sans-serif; font-size: 0.95rem;
      transition: border-color 0.3s, box-shadow 0.3s; outline: none;
    }
    .form-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245,197,24,0.15);
    }
    .login-btn {
      width: 100%; margin-top: 1.5rem; padding: 0.9rem;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
      border: none; border-radius: 0.6rem;
      font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700;
      letter-spacing: 0.15em; color: #0a0a0f; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s; text-transform: uppercase;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(245,197,24,0.4); filter: brightness(1.1); }
    .login-btn:active { transform: translateY(0); }
    .login-error {
      color: #ff6b6b; font-size: 0.8rem; text-align: center;
      margin-top: 1rem; min-height: 1.2em; transition: opacity 0.3s;
    }


    /* ─── DASHBOARD SHELL ─── */
    #dashboard { display: none; position: relative; z-index: 1; height: 100vh; overflow: hidden; flex-direction: column; }

    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 2rem;
      background: rgba(10,10,15,0.95);
      border-bottom: 1px solid rgba(245,197,24,0.12);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand {
      font-family: 'Cinzel', serif; font-weight: 700; font-size: 1rem;
      color: var(--gold); opacity: 0.7; letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .nav-right { display: flex; align-items: center; gap: 1.25rem; }
    .nav-user { font-size: 0.8rem; color: var(--gold); opacity: 0.75; }
    .logout-btn {
      background: transparent; border: 1px solid rgba(245,197,24,0.35);
      border-radius: 0.4rem; color: var(--gold);
      font-family: 'Raleway', sans-serif; font-size: 0.78rem;
      padding: 0.35rem 0.9rem; cursor: pointer; letter-spacing: 0.08em; transition: all 0.2s;
    }
    .logout-btn:hover { background: rgba(245,197,24,0.1); border-color: var(--gold); }

    /* ─── DASH INNER ─── */
    .dash-inner {
      flex: 1; overflow: hidden; position: relative;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 2rem; gap: 2rem; text-align: center;
    }
    .welcome-header {
      position: absolute; top: 2rem; left: 0; right: 0;
      font-family: 'Cinzel', serif; font-size: clamp(0.8rem, 1.8vw, 1.1rem);
      font-weight: 700; letter-spacing: 0.15em; color: var(--gold);
      text-transform: uppercase;
    }

    /* ─── SEQUENCE ─── */
    .seq-display {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      justify-content: center; max-width: 820px;
    }
    .seq-num {
      font-family: monospace; font-size: 1.1rem;
      color: var(--gold); opacity: 0.75;
    }
    .seq-num.new { animation: appear 0.65s ease forwards; }
    @keyframes appear {
      from { opacity: 0; }
      to   { opacity: 0.75; }
    }

    footer {
      text-align: center; padding: 1.25rem;
      font-size: 0.7rem; opacity: 0.3; letter-spacing: 0.15em;
      border-top: 1px solid rgba(245,197,24,0.06);
    }

    .fade-in { animation: fadeIn 0.5s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<!-- artifact offset: F(18) -->

<div class="particles" id="particles"></div>


<div id="login-page">
  <div class="phi-badge">φ</div>
  <div class="login-logo">FibFanatics</div>
  <div class="login-tagline">The Golden Brotherhood</div>

  <div class="login-card">
    <h2>Enter the Sanctuary</h2>
    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="e.g. golden_ratio_enjoyer" autocomplete="off" />
      </div>
      <div class="form-group">
        <label>Sacred Password</label>
        <div style="position:relative">
          <input type="password" id="password" placeholder="••••••••" style="padding-right:2.75rem" />
          <button type="button" onclick="togglePass()" id="eye-btn" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gold);opacity:0.55;font-size:1.1rem;line-height:1;padding:0;transition:opacity 0.2s" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.55'">👁</button>
        </div>
      </div>
      <button type="submit" class="login-btn">Ascend ✦</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>


</div>


<div id="dashboard">
  <nav class="nav">
    <div class="nav-brand">φ</div>
    <div class="nav-right">
      <span class="nav-user" id="nav-username"></span>
      <button class="logout-btn" onclick="logout()">exit</button>
    </div>
  </nav>

  <div class="dash-inner">
    <div class="welcome-header">welcome to the sanctuary</div>
    <div class="seq-display" id="seq-display"></div>
  </div>

  <footer>φ</footer>
</div>

<script>
  for (let i = 0; i < 120; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const dur = Math.random()*15+10;
    p.style.cssText = `left:${Math.random()*100}%;width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;animation-duration:${dur}s;animation-delay:-${Math.random()*dur}s`;
    document.getElementById('particles').appendChild(p);
  }

  function togglePass() {
    const inp = document.getElementById('password');
    const btn = document.getElementById('eye-btn');
    if (inp.type === 'password') { inp.type = 'text'; btn.style.opacity = '1'; }
    else { inp.type = 'password'; btn.style.opacity = '0.55'; }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const errEl = document.getElementById('login-error');

    if (!user) {
      errEl.textContent = 'Username required.';
      return false;
    }

    errEl.textContent = '';
    try {
      const resp = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      });
      const data = await resp.json();
      if (!data.ok) {
        errEl.textContent = data.error || 'Login failed.';
        return false;
      }
      sessionStorage.setItem('fib_user', data.username);
      showDashboard(data.username);
    } catch (err) {
      errEl.textContent = 'Network error: ' + err.message;
    }
    return false;
  }

  function showDashboard(username) {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    document.getElementById('nav-username').textContent = username;
    initDashboard();
  }

  function logout() {
    sessionStorage.removeItem('fib_user');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-page').style.display = 'flex';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('login-error').textContent = '';
  }

  let fibs = [1, 1];
  let fibInterval = null;
  const seqEl = () => document.getElementById('seq-display');
  function appendNum(n, animate) {
    const s = document.createElement('span');
    s.className = 'seq-num' + (animate ? ' new' : '');
    s.textContent = n.toLocaleString();
    seqEl().appendChild(s);
  }
  function renderFibs() {
    seqEl().innerHTML = '';
    fibs.forEach(n => appendNum(n, false));
  }
  function addFib() {
    if (fibs.length >= 28) {
      fibs = [1, 1];
      renderFibs();
    } else {
      const next = fibs[fibs.length-1] + fibs[fibs.length-2];
      fibs.push(next);
      appendNum(next, true);
    }
  }

  function fireBackgroundRequests() {
    [
      '/members',
      '/sacred-texts',
      '/golden-records',
      '/sequencer',
      '/ebmarah',
      '/archive',
      '/inner-circle',
      '/vault',
    ].forEach(r => fetch(r).catch(() => {}));
  }

  function initDashboard() {
    clearInterval(fibInterval);
    fibs = [1, 1];
    renderFibs();
    fibInterval = setInterval(addFib, 900);
    fireBackgroundRequests();
  }

  const stored = sessionStorage.getItem('fib_user');
  if (stored) showDashboard(stored);

</script>
</body>
</html>
